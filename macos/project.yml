name: AIUsageMonitor
options:
  bundleIdPrefix: com.gmalbert
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AIUsageMonitorCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PROVISIONING_PROFILE: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  AIUsageMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/AIUsageMonitor
    dependencies:
      - package: AIUsageMonitorCore
        product: AIUsageMonitorCore
      - target: UsageWidget
        embed: true
    info:
      path: Sources/AIUsageMonitor/Info.plist
      properties:
        CFBundleDisplayName: AI Usage Monitor
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.gmalbert.aiusagemonitor
            CFBundleURLSchemes:
              - aiusagemonitor
    entitlements:
      path: AIUsageMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gmalbert.aiusagemonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmalbert.aiusagemonitor
  UsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/UsageWidget
    dependencies:
      - package: AIUsageMonitorCore
        product: AIUsageMonitorCore
    info:
      path: Sources/UsageWidget/Info.plist
      properties:
        CFBundleDisplayName: AI Usage Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: UsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network-client: true
        com.apple.security.application-groups:
          - group.com.gmalbert.aiusagemonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmalbert.aiusagemonitor.UsageWidget
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../.."
schemes:
  AIUsageMonitor:
    build:
      targets:
        AIUsageMonitor: all
    run:
      config: Debug
    archive:
      config: Release
